{{- $root := . -}}
{{- range $role, $pool := .Values.pools }}
{{- if gt (int $pool.replicas) 0 }}
{{ $data := mergeOverwrite (deepCopy $root.Values.data) (default dict $pool.data) -}}
{{ $cache := mergeOverwrite (deepCopy $root.Values.cache) (default dict $pool.cache) -}}
{{ $resources := default $root.Values.resources $pool.resources }}
{{ $scratch := mergeOverwrite (deepCopy $root.Values.scratch) (default dict $pool.scratch) -}}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "ether.name" $root }}-{{ $role }}
  labels:
    {{- include "ether.labels" $root | nindent 4 }}
spec:
  serviceName: {{ include "ether.name" $root }}-private
  replicas: {{ $pool.replicas }}
  podManagementPolicy: Parallel
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  updateStrategy:
    type: OnDelete
  selector:
    matchLabels:
      {{- include "ether.selector" $root | nindent 6 }}
      ether.plex/role: {{ $role }}
  template:
    metadata:
      labels:
        {{- include "ether.selector" $root | nindent 8 }}
        ether.plex/role: {{ $role }}
        ether.plex/public: {{ has $role (list "full" "server") | quote }}
        ether.plex/media: {{ has $role (list "full" "delivery") | quote }}
      annotations:
        checksum/deployment: {{ include (print $root.Template.BasePath "/configmap.yaml") $root | sha256sum }}
        {{- with (mergeOverwrite (deepCopy $root.Values.podAnnotations) (default dict $pool.podAnnotations)) }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ $root.Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml $root.Values.podSecurityContext | nindent 8 }}
      {{- with $root.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (default $root.Values.runtimeClassName $pool.runtimeClassName) }}
      runtimeClassName: {{ . | quote }}
      {{- end }}
      nodeSelector:
        {{- toYaml (default $root.Values.nodeSelector $pool.nodeSelector) | nindent 8 }}
      tolerations:
        {{- toYaml (default $root.Values.tolerations $pool.tolerations) | nindent 8 }}
      affinity:
        {{- toYaml (default $root.Values.affinity $pool.affinity) | nindent 8 }}
      topologySpreadConstraints:
        {{- toYaml (default $root.Values.topologySpreadConstraints $pool.topologySpreadConstraints) | nindent 8 }}
      containers:
        - name: ether
          image: {{ include "ether.image" $root | quote }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          securityContext:
            {{- toYaml $root.Values.securityContext | nindent 12 }}
          # Use the image's binary directly: volumes are owned by fsGroup;
          # its default root/chown entrypoint is unnecessary here.
          command: [/bin/sh, -ec]
          args:
            - |
              umask 077
              for legacy in node.json config.json .credentials-key; do
                if [ -e "/config/$legacy" ]; then
                  echo "ether: legacy identity at PVC root; explicit migration required" >&2
                  exit 64
                fi
              done
              mkdir -p /config/ether
              chmod 700 /config/ether
              # Let the Go runtime collect before the container limit, not at
              # it: anonymous heap (for example the daily catalogue-index
              # build) is what the kernel cannot reclaim. Mapped index pages
              # are clean page cache and are reclaimed instead of OOM-killing.
              if [ -z "${GOMEMLIMIT:-}" ] && [ "${ETHER_MEMORY_LIMIT_MIB:-0}" -gt 0 ]; then
                export GOMEMLIMIT="$((ETHER_MEMORY_LIMIT_MIB * 9 / 10))MiB"
              fi
              sed "s/__ETHER_POD_NAME__/${POD_NAME}/g;s/__ETHER_NAMESPACE__/${POD_NAMESPACE}/g" /etc/ether/deployment.json > /tmp/deployment.json
              exec /usr/lib/ether/ether
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - {name: ETHER_DEPLOYMENT_FILE, value: /tmp/deployment.json}
            - {name: ETHER_DATA_DIR, value: /config/ether}
            # Container memory limit in MiB (node allocatable when unset).
            - name: ETHER_MEMORY_LIMIT_MIB
              valueFrom: {resourceFieldRef: {containerName: ether, resource: limits.memory, divisor: 1Mi}}
            - {name: XDG_CACHE_HOME, value: /cache}
            - {name: TMPDIR, value: /scratch}
            - {name: HOME, value: /config/ether}
            {{- if hasKey (default dict $resources.limits) "nvidia.com/gpu" }}
            - {name: NVIDIA_DRIVER_CAPABILITIES, value: "compute,video,utility"}
            {{- end }}
          ports:
            {{- if has $role (list "full" "server" "delivery") }}
            - {name: public, containerPort: 32400}
            {{- end }}
            - {name: private, containerPort: 32401}
            - {name: probes, containerPort: 32402}
          startupProbe:
            httpGet: {path: /startupz, port: probes}
            {{- toYaml $root.Values.probes.startup | nindent 12 }}
          readinessProbe:
            {{- if has $role (list "full" "server") }}
            httpGet: {path: /admissionz, port: probes}
            {{- else }}
            httpGet: {path: /readyz, port: probes}
            {{- end }}
            {{- toYaml $root.Values.probes.readiness | nindent 12 }}
          livenessProbe:
            httpGet: {path: /livez, port: probes}
            {{- toYaml $root.Values.probes.liveness | nindent 12 }}
          resources:
            {{- toYaml $resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /config}
            - {name: cache, mountPath: /cache}
            - {name: scratch, mountPath: /scratch}
            - {name: tmp, mountPath: /tmp}
            - {name: deployment, mountPath: /etc/ether, readOnly: true}
            - {name: database, mountPath: /run/ether/database, readOnly: true}
            - {name: cluster, mountPath: /run/ether/cluster, readOnly: true}
            - {name: authority, mountPath: /run/ether/authority, readOnly: true}
      volumes:
        - name: deployment
          configMap: {name: {{ include "ether.name" $root }}-{{ $role }}}
        - name: database
          secret:
            secretName: {{ required "secrets.database.existingSecret is required" $root.Values.secrets.database.existingSecret | quote }}
            defaultMode: 0440
            items: [{key: {{ $root.Values.secrets.database.key | quote }}, path: url}]
        - name: cluster
          secret:
            secretName: {{ required "secrets.cluster.existingSecret is required" $root.Values.secrets.cluster.existingSecret | quote }}
            defaultMode: 0440
            items: [{key: {{ $root.Values.secrets.cluster.key | quote }}, path: key}]
        - name: authority
          secret:
            secretName: {{ required "secrets.authority.existingSecret is required" $root.Values.secrets.authority.existingSecret | quote }}
            defaultMode: 0440
            items:
              - {key: {{ $root.Values.secrets.authority.certKey | quote }}, path: ca.crt}
              - {key: {{ $root.Values.secrets.authority.privateKey | quote }}, path: ca.key}
              - {key: {{ $root.Values.secrets.authority.rootsKey | quote }}, path: roots.pem}
        - name: scratch
          emptyDir: {sizeLimit: {{ $scratch.sizeLimit | quote }}}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
        {{- if eq $cache.type "emptyDir" }}
        - name: cache
          emptyDir: {sizeLimit: {{ $cache.size | quote }}}
        {{- end }}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: {{ $data.accessModes | toJson }}
        {{- if $data.storageClass }}
        storageClassName: {{ $data.storageClass | quote }}
        {{- end }}
        resources: {requests: {storage: {{ $data.size | quote }}}}
    {{- if eq $cache.type "persistent" }}
    - metadata: {name: cache}
      spec:
        accessModes: [ReadWriteOnce]
        {{- if $cache.storageClass }}
        storageClassName: {{ $cache.storageClass | quote }}
        {{- end }}
        resources: {requests: {storage: {{ $cache.size | quote }}}}
    {{- end }}
{{- end }}
{{- end }}
