{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ether.name" . }}
  labels:
    {{- include "ether.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ether.selector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "ether.selector" . | nindent 14 }}
      ports: [{protocol: TCP, port: 32401}]
    {{- if .Values.networkPolicy.publicIngress }}
    - from:
        {{- toYaml .Values.networkPolicy.publicIngress | nindent 8 }}
      ports: [{protocol: TCP, port: 32400}]
    {{- end }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "ether.selector" . | nindent 14 }}
      ports: [{protocol: TCP, port: 32401}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    {{- with .Values.networkPolicy.egress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
