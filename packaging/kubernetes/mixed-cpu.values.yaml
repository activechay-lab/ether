# Acceptance target: requires the integrated image to enable every role.
# References only. Create these Secrets outside Helm, from local files.
runtime:
  clockBoundKnown: true
  clockSkewMillis: 1000
secrets:
  database: {existingSecret: ether-db}
  cluster: {existingSecret: ether-cluster}
  authority: {existingSecret: ether-authority}
pools:
  full:
    replicas: 2
  source:
    replicas: 1
  transcode:
    replicas: 1
    resources:
      requests: {cpu: "1", memory: 512Mi}
      limits: {cpu: "2", memory: 2Gi}
  delivery:
    replicas: 1

# Mixed public roles require an actual controller and one reachable public host.
# Replace this hostname and select the installed IngressClass before deployment.
ingress:
  enabled: true
  canonicalHLSLabOnly: true
  hosts: [ether.example.test]
