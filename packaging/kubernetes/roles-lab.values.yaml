# LAB ONLY guard-enablement candidate; never a shipping activation reference.
# Exact coordinator-approved corrected LAB candidate, not a release image.
image:
  repository: ether035-ha
  tag: lab-982a06453
  pullPolicy: Never
runtime:
  clockBoundKnown: true
  clockSkewMillis: 1000
  ledgerCapacity: 1000000
secrets:
  database: {existingSecret: ether-db}
  cluster: {existingSecret: ether-cluster}
  authority: {existingSecret: ether-authority}
pools:
  full: {replicas: 0}
  server:
    replicas: 1
    bootstrap: false
    nodeSelector: {kubernetes.io/hostname: ether035-ha-worker}
  source:
    replicas: 1
    bootstrap: false
    nodeSelector: {kubernetes.io/hostname: ether035-ha-control-plane}
    tolerations:
      - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
  transcode:
    replicas: 1
    bootstrap: false
    nodeSelector: {kubernetes.io/hostname: ether035-ha-worker2}
    resources:
      requests: {cpu: 250m, memory: 256Mi}
      limits: {cpu: '2', memory: 1Gi}
  delivery:
    replicas: 1
    bootstrap: false
    nodeSelector: {kubernetes.io/hostname: ether035-ha-worker}
cache: {size: 1Gi}
scratch: {sizeLimit: 1Gi}
resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {cpu: '1', memory: 1Gi}
ingress:
  enabled: true
  canonicalHLSLabOnly: true
  className: ''
  annotations:
    kubernetes.io/ingress.class: ether035-ha
  hosts: [ether035-roles.test]
