name: Reference recording drift
on:
  pull_request:
    paths:
      - 'testdata/conform/**'
      - 'internal/conform/profiles/**'
      - 'cmd/conformdiff/**'
      - 'scripts/reference-drift.sh'
      - '.github/workflows/reference-drift.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: .reference-base
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build offline comparer
        run: go build -o "$RUNNER_TEMP/conformdiff" ./cmd/conformdiff
      - name: Compare recordings without reference access
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/reference-drift"
          failed=0
          for protocol in jellyfin emby silo; do
            "$RUNNER_TEMP/conformdiff" drift -protocol "$protocol" \
              -fixtures ".reference-base/testdata/conform/$protocol" \
              -candidate "testdata/conform/$protocol" \
              > "$RUNNER_TEMP/reference-drift/$protocol.json" \
              2> "$RUNNER_TEMP/reference-drift/$protocol.log" || failed=1
          done
          exit "$failed"
      - name: Preserve every report including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reference-drift-${{ github.sha }}
          path: ${{ runner.temp }}/reference-drift
          if-no-files-found: error
