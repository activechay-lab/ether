name: Nightly 800k performance gate

# The per-push gate (ci.yml, performance) compares a 54k and a 540k row
# library. This one compares 80k and 800k titles with long-tail detail rows
# (1.76M catalogue rows), the size of a household mirroring TMDB with
# "hide obscure titles" off. It takes too long for every push, so it runs
# nightly on main and on demand (docs/performance.md).
on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to measure
        required: false
        default: main

concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref || 'main' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  performance-800k:
    name: 800k library-scale performance gate
    timeout-minutes: 150
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref || 'main' }}
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Performance gate (80k / 800k titles)
        env:
          CGO_ENABLED: "0"
          ETHER_PERF_GATE: xlarge
          ETHER_PERF_GATE_REPORT: ${{ runner.temp }}/perf-gate-800k.md
        run: go test ./internal/app -run '^TestPerformanceGate$' -count=1 -timeout 140m -v
      - name: Publish the gate report
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/perf-gate-800k.md" ]; then cat "$RUNNER_TEMP/perf-gate-800k.md" >> "$GITHUB_STEP_SUMMARY"; fi
